# CI: formato, lint, tipos, tests, sistema de diseño (M1), base de datos (M2), identidad (M3),
# catálogo y SEO (M4), pedido (M5, Chromium y WebKit), idioma del documento en el build de
# producción y servicios locales. M10: backup y restauración (local), CSP por página y Worker.
# Los nombres de los 7 jobs son los checks obligatorios del ruleset de `main` (DEPLOYMENT.md, §6):
# cambiar uno exige actualizar el ruleset.
# Las acciones están fijadas a un commit exacto (con la versión en el comentario).
# Los logs de un repositorio público son públicos: ningún paso imprime secretos ni datos.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formato, lint, tipos y tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

      - name: Validación de variables de entorno con los valores de ejemplo
        run: |
          cp .env.example .env
          npm run env:check

  design:
    name: Sistema de diseño y accesibilidad (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Desde M4 las páginas públicas leen la API del catálogo: base de desarrollo con la semilla.
      - name: Levantar PostgreSQL y preparar la base
        run: |
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 120 postgres
          npm run db:setup

      - name: Instalar Chromium para Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # Variantes de imagen (M4): `npm run dev` y `npm run build` las generan si faltan y, desde
      # cero, tardan varios minutos en el runner (más que la espera de los servidores de Playwright).
      # Se generan en este paso, fuera de esas esperas, y se guardan en caché según las fotos, el
      # script, los anchos y las dependencias (sharp).
      - name: Caché de las variantes de imagen
        id: images-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/public/images
          key: images-${{ runner.os }}-${{ hashFiles('apps/web/photos/source/**', 'apps/web/scripts/build-images.ts', 'apps/web/app/catalog/images.ts', 'package-lock.json') }}

      - name: Variantes de imagen (AVIF, WebP y Open Graph)
        env:
          CACHE_HIT: ${{ steps.images-cache.outputs.cache-hit }}
        run: |
          # Con la clave exacta el contenido es válido, pero el script compara fechas y el checkout
          # las renueva: se marcan como recientes para que no se regeneren.
          if [ "$CACHE_HIT" = "true" ]; then
            find apps/web/public/images -type f -exec touch {} +
          fi
          npm run images -w @marea-baja/web

      # La configuración levanta la API y el servidor de desarrollo de la web.
      - name: axe, teclado, idiomas, responsive y movimiento reducido
        run: npm run test:e2e -w @marea-baja/web

      # M9 (§12): auditoría de calidad sobre las pantallas reales de M1–M8 (visitante, cliente y
      # admin), en es-CR y en: axe WCAG 2.2 AA a 375 y 1280 px, desbordamiento a 4 anchos, foco
      # visible, movimiento reducido y formato de fechas por idioma. Su propia API y su propia web
      # (3440 y 5218) sobre <base>_e2e; un idioma por invocación por el freno de ráfagas.
      - name: Auditoría de calidad de M9 (31 pantallas × 2 idiomas × 4 anchos)
        run: npm run test:calidad -w @marea-baja/web

      - name: Bajar servicios
        if: always()
        run: docker compose down --volumes

  services:
    name: Servicios locales (Docker Compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Levantar PostgreSQL y Mailpit
        run: |
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 120

      - name: Comprobar PostgreSQL 17
        run: docker compose exec -T postgres psql -U marea -d marea_baja -tAc "SHOW server_version" | grep -E '^17\.'

      - name: Comprobar Mailpit
        run: curl --fail --silent http://127.0.0.1:8025/api/v1/info > /dev/null

      - name: Bajar servicios
        if: always()
        run: docker compose down --volumes

  database:
    name: Base de datos (Prisma, restricciones y AuditLog)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Levantar PostgreSQL
        run: |
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 120 postgres

      - name: Migraciones, rol de la aplicación y semilla
        run: npm run db:setup

      - name: Sin diferencias entre el esquema y las migraciones
        run: npm run db:drift -w @marea-baja/api

      - name: Restricciones, AuditLog, permisos, semilla e integración de identidad (PostgreSQL real)
        run: npm run test:db

      # M10 (ADR 0010, D-M10-8): backup cifrado y restauración de punta a punta contra la base local,
      # en un contenedor con el mismo pg_dump que el servidor (17.11) y age: volcado ilegible sin la
      # clave, volcado alterado rechazado, conteos iguales, `prisma migrate status` y humo de la API.
      # Nunca usa B2 ni producción.
      - name: Backup y restauración (prueba local, sin B2)
        run: npm run backup:selftest

      - name: Bajar servicios
        if: always()
        run: docker compose down --volumes

  identity:
    name: Identidad (API, Mailpit y E2E de la cuenta)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Levantar PostgreSQL y Mailpit
        run: |
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 120

      - name: Instalar Chromium para Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # Variantes de imagen (M4): `npm run dev` y `npm run build` las generan si faltan y, desde
      # cero, tardan varios minutos en el runner (más que la espera de los servidores de Playwright).
      # Se generan en este paso, fuera de esas esperas, y se guardan en caché según las fotos, el
      # script, los anchos y las dependencias (sharp).
      - name: Caché de las variantes de imagen
        id: images-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/public/images
          key: images-${{ runner.os }}-${{ hashFiles('apps/web/photos/source/**', 'apps/web/scripts/build-images.ts', 'apps/web/app/catalog/images.ts', 'package-lock.json') }}

      - name: Variantes de imagen (AVIF, WebP y Open Graph)
        env:
          CACHE_HIT: ${{ steps.images-cache.outputs.cache-hit }}
        run: |
          # Con la clave exacta el contenido es válido, pero el script compara fechas y el checkout
          # las renueva: se marcan como recientes para que no se regeneren.
          if [ "$CACHE_HIT" = "true" ]; then
            find apps/web/public/images -type f -exec touch {} +
          fi
          npm run images -w @marea-baja/web

      # La configuración crea su propia base (<base>_e2e) y levanta la API y la web.
      # Turnstile usa el proveedor falso y el script de Cloudflare se reemplaza: sin llamadas externas.
      - name: Registro, correo, verificación, login, perfil, recuperación, Turnstile y axe
        run: npm run test:e2e:auth -w @marea-baja/web

      - name: Bajar servicios
        if: always()
        run: docker compose down --volumes

  order:
    # M10 (ADR 0010, D-M10-7): nombre corto. GitHub truncaba el anterior ("… y ...") y un check
    # obligatorio del ruleset tiene que coincidir exactamente con el nombre que informa.
    name: Pedido, pagos, operación y admin (Chromium y WebKit)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Sin correo real: las cuentas de prueba se crean ya verificadas en la base E2E. Mailpit recibe
      # los correos de estado de la suite de operación (M7).
      - name: Levantar PostgreSQL y Mailpit
        run: |
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 120 postgres mailpit

      # WebKit de Playwright con perfil de iPhone (`Mobile Safari`): no es Safari de iOS real.
      - name: Instalar Chromium y WebKit para Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium webkit

      - name: Caché de las variantes de imagen
        id: images-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/public/images
          key: images-${{ runner.os }}-${{ hashFiles('apps/web/photos/source/**', 'apps/web/scripts/build-images.ts', 'apps/web/app/catalog/images.ts', 'package-lock.json') }}

      - name: Variantes de imagen (AVIF, WebP y Open Graph)
        env:
          CACHE_HIT: ${{ steps.images-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            find apps/web/public/images -type f -exec touch {} +
          fi
          npm run images -w @marea-baja/web

      # La configuración crea su base (<base>_e2e) y levanta la API (con el modo de demostración
      # fuera de horario, para no depender de la hora) y la web. Carta → hoja de producto →
      # carrito → fusión al iniciar sesión → checkout → pedido, en es-CR y en, y axe.
      - name: Carrito, fusión, checkout y pedido (Chromium y Mobile Safari)
        run: npm run test:e2e:pedido -w @marea-baja/web

      # M6: pago demo con su propia API (freno de ráfagas aparte). Escenarios de la tarjeta demo,
      # rechazo y reintento, pendiente resuelto por la reconciliación y contra entrega.
      - name: Pago demo (Chromium y Mobile Safari)
        run: npm run test:e2e:pagos -w @marea-baja/web

      # M7 (escenario 2): el staff confirma, avanza y cancela en el Pase; el cliente sigue el pedido
      # en la línea de marea, su historial y la bandeja de demostración; correos en Mailpit.
      - name: Operación y Pase (Chromium y Mobile Safari)
        run: npm run test:e2e:operacion -w @marea-baja/web

      # M8 (escenarios 3 y 4): el admin edita la carta, publica la pesca del día, cambia la
      # configuración, bloquea una cuenta, cancela y reembolsa; staff y clientes no entran; los
      # conflictos y las validaciones se ven en la interfaz. Su propia API (freno de ráfagas aparte).
      - name: Admin (Chromium y Mobile Safari)
        run: npm run test:e2e:admin -w @marea-baja/web

      - name: Bajar servicios
        if: always()
        run: docker compose down --volumes

  catalog:
    name: Catálogo y SEO (build prerenderizado y E2E)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Levantar PostgreSQL
        run: |
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 120 postgres

      - name: Instalar Chromium para Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # Variantes de imagen (M4): `npm run dev` y `npm run build` las generan si faltan y, desde
      # cero, tardan varios minutos en el runner (más que la espera de los servidores de Playwright).
      # Se generan en este paso, fuera de esas esperas, y se guardan en caché según las fotos, el
      # script, los anchos y las dependencias (sharp).
      - name: Caché de las variantes de imagen
        id: images-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/public/images
          key: images-${{ runner.os }}-${{ hashFiles('apps/web/photos/source/**', 'apps/web/scripts/build-images.ts', 'apps/web/app/catalog/images.ts', 'package-lock.json') }}

      - name: Variantes de imagen (AVIF, WebP y Open Graph)
        env:
          CACHE_HIT: ${{ steps.images-cache.outputs.cache-hit }}
        run: |
          # Con la clave exacta el contenido es válido, pero el script compara fechas y el checkout
          # las renueva: se marcan como recientes para que no se regeneren.
          if [ "$CACHE_HIT" = "true" ]; then
            find apps/web/public/images -type f -exec touch {} +
          fi
          npm run images -w @marea-baja/web

      # La configuración crea su base (<base>_e2e), levanta la API, hace el build de producción con
      # prerender (variantes de imagen, HTML por idioma, sitemap y robots) y lo sirve como el
      # hosting estático. Prueba el HTML crudo, los datos en vivo, la carta y axe.
      - name: Build de producción, prerender, SEO y E2E del catálogo
        run: npm run test:e2e:catalog -w @marea-baja/web

      # Idioma del documento (<html lang>) sobre el build servido por serve-build: páginas
      # prerenderizadas y fallback SPA real (__spa-fallback.html). Vuelve a crear <base>_e2e y su
      # propia API (3300) y web (5177), después de la suite anterior (nunca a la vez). Reutiliza las
      # variantes de imagen ya generadas. No envía correos: no necesita Mailpit. Corre aunque la
      # suite del catálogo falle, para que su resultado se vea por separado; si falla, falla el job.
      # M10 (D-M10-5): la misma suite recorre además las 57 páginas del sitemap, las rutas de la SPA
      # y los flujos principales con la CSP por página, y falla con cualquier violación.
      - name: Idioma del documento y CSP en el build de producción (12 pruebas)
        if: ${{ !cancelled() }}
        run: npm run test:e2e:produccion -w @marea-baja/web

      - name: Cada HTML con su CSP al día (hashes por página)
        if: ${{ !cancelled() }}
        run: npm run csp:check -w @marea-baja/web

      - name: Bajar servicios
        if: always()
        run: docker compose down --volumes
