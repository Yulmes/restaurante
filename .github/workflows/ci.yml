# CI: formato, lint, tipos, tests, sistema de diseño (M1), base de datos (M2), identidad (M3) y
# servicios locales.
# Las acciones están fijadas a un commit exacto (con la versión en el comentario).
# Los logs de un repositorio público son públicos: ningún paso imprime secretos ni datos.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formato, lint, tipos y tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

      - name: Validación de variables de entorno con los valores de ejemplo
        run: |
          cp .env.example .env
          npm run env:check

  design:
    name: Sistema de diseño y accesibilidad (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Instalar Chromium para Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: axe, teclado, idiomas, responsive y movimiento reducido
        run: npm run test:e2e -w @marea-baja/web

      - name: Build de producción de la web
        run: npm run build -w @marea-baja/web

  services:
    name: Servicios locales (Docker Compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Levantar PostgreSQL y Mailpit
        run: |
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 120

      - name: Comprobar PostgreSQL 17
        run: docker compose exec -T postgres psql -U marea -d marea_baja -tAc "SHOW server_version" | grep -E '^17\.'

      - name: Comprobar Mailpit
        run: curl --fail --silent http://127.0.0.1:8025/api/v1/info > /dev/null

      - name: Bajar servicios
        if: always()
        run: docker compose down --volumes

  database:
    name: Base de datos (Prisma, restricciones y AuditLog)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Levantar PostgreSQL
        run: |
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 120 postgres

      - name: Migraciones, rol de la aplicación y semilla
        run: npm run db:setup

      - name: Sin diferencias entre el esquema y las migraciones
        run: npm run db:drift -w @marea-baja/api

      - name: Restricciones, AuditLog, permisos, semilla e integración de identidad (PostgreSQL real)
        run: npm run test:db

      - name: Bajar servicios
        if: always()
        run: docker compose down --volumes

  identity:
    name: Identidad (API, Mailpit y E2E de la cuenta)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Levantar PostgreSQL y Mailpit
        run: |
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 120

      - name: Instalar Chromium para Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # La configuración crea su propia base (<base>_e2e) y levanta la API y la web.
      # Turnstile usa el proveedor falso y el script de Cloudflare se reemplaza: sin llamadas externas.
      - name: Registro, correo, verificación, login, perfil, recuperación, Turnstile y axe
        run: npm run test:e2e:auth -w @marea-baja/web

      - name: Bajar servicios
        if: always()
        run: docker compose down --volumes
